name: DataHub E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  datahub:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: bash scripts/test-datahub-e2e.sh
