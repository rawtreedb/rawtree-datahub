[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rawtree-datahub"
version = "0.1.0a1"
description = "Official RawTree metadata source for DataHub"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "RawTree" }]
keywords = ["datahub", "metadata", "rawtree", "data-catalog"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = [
  "acryl-datahub>=1.3.1,<2",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://rawtree.com"
Documentation = "https://github.com/rawtreedb/rawtree-datahub#readme"
Issues = "https://github.com/rawtreedb/rawtree-datahub/issues"
Source = "https://github.com/rawtreedb/rawtree-datahub"

[project.entry-points."datahub.ingestion.source.plugins"]
rawtree = "rawtree_datahub.source:RawTreeSource"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rawtree_datahub"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "datahub_e2e: requires a running DataHub GMS instance",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["rawtree_datahub"]
